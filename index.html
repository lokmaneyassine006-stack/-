    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@300;400;500;600;700;800;900;1000&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('together_change_theme') || 
                      localStorage.getItem('TOGETHER_CHANGE_STORE_2026_themeMode') || 
                      localStorage.getItem('themeMode') || 
                      localStorage.getItem('theme');
          if (theme) theme = theme.replace(/"/g, '').trim();
          if (theme === 'auto') {
            theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          if (theme === 'dark') {
            document.documentElement.classList.add('dark', 'theme-dark');
          } else if (theme === 'sepia') {
            document.documentElement.classList.add('theme-sepia');
          } else {
            document.documentElement.classList.add('theme-light');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="font-sans antialiased bg-[#fbfbf8] dark:bg-[#0b0f19] text-stone-900 dark:text-stone-100 transition-colors duration-200 selection:bg-teal-500 selection:text-white" style="margin:0;padding:0;overflow-x:hidden;">
    <div id="root" style="width:100%;max-width:100%;overflow-x:hidden;">
      <!-- Instant Pre-Hydration Placeholder (Eliminates White Flash & Content Jitter) -->

        <div style="display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;">

              <path d="M6 6h10"/>
              <path d="M6 10h10"/>
            </svg>
          </div>
          <div style="font-size:18px;font-weight:800;color:#134e4a;">مكتبة معاً نحو التغيير</div>
          <div style="width:140px;height:4px;background:#e5e7eb;border-radius:9999px;overflow:hidden;position:relative;">
            <div style="position:absolute;top:0;left:0;height:100%;width:50%;background:#0d9488;border-radius:9999px;animation:pulse 1s infinite alternate;"></div>
          </div>
